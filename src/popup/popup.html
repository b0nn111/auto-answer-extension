<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自动答题助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="header">
      <h1>🤖 自动答题助手</h1>
      <span class="version">v1.1.1</span>
    </div>

    <!-- Master toggle -->
    <div class="toggle-row">
      <span class="toggle-label">答题模式</span>
      <label class="toggle-switch">
        <input type="checkbox" id="master-toggle">
        <span class="toggle-slider"></span>
      </label>
      <span id="toggle-status" class="toggle-status">关闭</span>
    </div>

    <!-- Diagnostics -->
    <div class="section">
      <div class="section-title">自检状态</div>
      <div id="diagnostics">
        <div class="diag-item" id="diag-aiapi">
          <span class="diag-icon">⏳</span>
          <span class="diag-label">AI API</span>
          <span class="diag-status">检测中...</span>
        </div>
        <div class="diag-item" id="diag-localai">
          <span class="diag-icon">⏳</span>
          <span class="diag-label">本地 AI</span>
          <span class="diag-status">检测中...</span>
        </div>
        <div class="diag-item" id="diag-freesearch">
          <span class="diag-icon">⏳</span>
          <span class="diag-label">免费搜题</span>
          <span class="diag-status">检测中...</span>
        </div>
        <div class="diag-item" id="diag-db">
          <span class="diag-icon">⏳</span>
          <span class="diag-label">本地题库</span>
          <span class="diag-status">检测中...</span>
        </div>
        <div class="diag-item" id="diag-ext">
          <span class="diag-icon">⏳</span>
          <span class="diag-label">扩展状态</span>
          <span class="diag-status">检测中...</span>
        </div>
      </div>
      <button id="rerun-btn" class="btn-secondary">🔄 重新检测</button>
    </div>

    <!-- Actions -->
    <div class="section actions-section">
      <button id="settings-btn" class="btn-primary">⚙️ 打开设置</button>
      <button id="scan-now-btn" class="btn-secondary">🔍 扫描当前页面</button>
    </div>

    <div class="feedback-line">反馈与改进：QQ 3923636786</div>
    <div class="footer">右键扩展图标 → 选项 也可打开设置</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
